[flake8]
ignore =
    # A constant stacklevel doesn't fit all call paths.  skip_file_prefixes
    # would make things easier, but that requires Python >= 3.12.
    B028,
    # zip(strict=...) requires Python >= 3.10.
    B905,
    E203,
    E266,
    E501,
    W503
max-line-length = 100
max-complexity = 18
select = B,C,E,F,W,T4,B9

[mypy]
ignore_missing_imports = true
